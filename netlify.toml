# Configuration Netlify — ZAKPA COIFFURE
# ============================================================================
# À chaque envoi sur GitHub (depuis le Mac OU depuis le back office en ligne),
# Netlify reconstruit le site lui-même :
#
#     node tools/galerie.mjs     galerie générée depuis assets/photos et assets/videos
#     node tools/publier.mjs     copie du site dans « public/ »
#
# Le dossier « public/ » n'est donc plus envoyé sur GitHub (voir .gitignore).
#
# Back office en ligne : https://<site>/gestion/
#   → API : netlify/functions/gestion.mjs
#   → variables à définir dans Netlify : GESTION_MOT_DE_PASSE, GITHUB_TOKEN
# ============================================================================

[build]
  publish = "public"
  command = "node tools/galerie.mjs && node tools/publier.mjs"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# ── Sécurité : en-têtes envoyés avec chaque page ─────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"


# ── Back office en ligne : jamais indexé, jamais mis en cache, jamais encadré ──
[[headers]]
  for = "/gestion/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
